name: E2E on Vercel Preview

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA to test"
        required: true
        type: string
      deployment_url:
        description: "Immutable Vercel deployment URL for this commit"
        required: true
        type: string

concurrency:
  # GitHub emits a run before evaluating the job condition. Only eligible
  # Vercel preview events share the cancellation key, so irrelevant deployment
  # events cannot cancel the real smoke test for this SHA.
  group: preview-smoke-${{ github.event.deployment.sha || github.event.inputs.commit_sha }}-${{ (github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.creator.login == 'vercel[bot]' && github.event.deployment_status.environment_url != '' && (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'preview'))) && 'eligible' || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.creator.login == 'vercel[bot]' &&
       github.event.deployment_status.environment_url != '' &&
       (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'preview'))
    runs-on: ubuntu-latest
    environment: preview
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Set preview target
        id: sha
        env:
          COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.deployment.sha }}
          BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_url || github.event.deployment_status.environment_url }}
        run: |
          echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.COMMIT_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm fetch
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm main exec playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm main exec playwright install chromium

      - name: Wait for ready
        env:
          BASE_URL: ${{ env.BASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for i in {1..50}; do
            if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              code=$(curl -Is -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$BASE_URL" | head -n1 | awk '{print $2}')
            else
              code=$(curl -Is "$BASE_URL" | head -n1 | awk '{print $2}')
            fi
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "301" ]; then exit 0; fi
            sleep 3
          done
          echo "Preview never went ready" >&2; exit 1

      - name: Run Playwright
        env:
          BASE_URL: ${{ env.BASE_URL }}
          # set only if you enabled Vercel Preview Protection
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Clerk keys needed for clerkSetup() in global-setup.ts
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm main exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/main/test-results
            apps/main/playwright-report
