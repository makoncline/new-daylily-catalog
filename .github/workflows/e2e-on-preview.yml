name: E2E on Vercel Preview

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to test (first 8 chars, e.g., abc12345)"
        required: true
        type: string

concurrency:
  # A second Vercel deployment for the same commit must not cancel the main
  # preview before the affected-path check identifies the app.
  group: main-preview-smoke-${{ github.event.deployment.id || github.event.inputs.commit_sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Detect main changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main: ${{ steps.affected.outputs.main }}
      trusted_candidate: ${{ steps.provenance.outputs.trusted }}
    steps:
      - name: Check out trusted classifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Check out preview candidate
        if: github.event_name == 'deployment_status'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Set up trusted Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install trusted Turbo
        id: trusted-turbo
        working-directory: trusted
        run: |
          npm install --global --ignore-scripts turbo@2.9.6
          turbo_binary="$(command -v turbo)"
          test -x "$turbo_binary"
          echo "path=$turbo_binary" >> "$GITHUB_OUTPUT"
      - name: Classify preview paths
        id: affected
        env:
          AFFECTED_APPS_TURBO_BINARY: ${{ steps.trusted-turbo.outputs.path }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          trusted_classifier="$GITHUB_WORKSPACE/trusted/.github/scripts/affected-apps.mjs"
          trusted_provenance="$GITHUB_WORKSPACE/trusted/.github/scripts/preview-candidate-provenance.mjs"
          if [ ! -f "$trusted_classifier" ] || [ ! -f "$trusted_provenance" ]; then
            echo "main=false" >> "$GITHUB_OUTPUT"
            echo "trusted_tools=false" >> "$GITHUB_OUTPUT"
            echo "Trusted preview tools are not installed on the default branch yet. Skip this bootstrap preview."
            exit 0
          fi
          echo "trusted_tools=true" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            cd "$GITHUB_WORKSPACE/trusted"
            node .github/scripts/affected-apps.mjs --force main --path .github/workflows/e2e-on-preview.yml
          else
            cd "$GITHUB_WORKSPACE/candidate"
            git rev-parse --verify "origin/$DEFAULT_BRANCH^{commit}"
            node "$GITHUB_WORKSPACE/trusted/.github/scripts/affected-apps.mjs" --base "origin/$DEFAULT_BRANCH" --head "$HEAD_SHA" --merge-base
          fi
      - name: Verify same-repository candidate
        id: provenance
        if: github.event_name == 'deployment_status' && steps.affected.outputs.trusted_tools == 'true'
        env:
          CANDIDATE_REF: ${{ github.event.deployment.ref }}
          HEAD_SHA: ${{ github.event.deployment.sha }}
        working-directory: candidate
        run: node "$GITHUB_WORKSPACE/trusted/.github/scripts/preview-candidate-provenance.mjs" --head "$HEAD_SHA" --ref "$CANDIDATE_REF"

  e2e:
    needs: scope
    if: >
      needs.scope.outputs.main == 'true' &&
      ((github.event_name == 'workflow_dispatch') ||
       (needs.scope.outputs.trusted_candidate == 'true' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment_status.creator.login == 'vercel[bot]' &&
        github.event.deployment_status.environment_url != '' &&
        (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'preview')))
    runs-on: ubuntu-latest
    environment: preview
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Compute commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "COMMIT_SHA=${{ github.event.inputs.commit_sha }}" >> $GITHUB_OUTPUT
          else
            echo "COMMIT_SHA=${{ github.event.deployment.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Enable corepack
        run: corepack enable

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.COMMIT_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm fetch
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm main exec playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm main exec playwright install chromium

      - name: Compute BASE_URL (alias)
        id: url
        run: |
          HASH=$(echo '${{ steps.sha.outputs.COMMIT_SHA }}' | cut -c1-8)
          echo "BASE_URL=https://${HASH}.deploy-preview.daylilycatalog.com" >> $GITHUB_ENV

      # Optional: wait until alias responds 200 to avoid races
      - name: Wait for ready
        env:
          BASE_URL: ${{ env.BASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for i in {1..50}; do
            if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              code=$(curl -Is -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$BASE_URL" | head -n1 | awk '{print $2}')
            else
              code=$(curl -Is "$BASE_URL" | head -n1 | awk '{print $2}')
            fi
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "301" ]; then exit 0; fi
            sleep 3
          done
          echo "Preview never went ready" >&2; exit 1

      - name: Run Playwright
        env:
          BASE_URL: ${{ env.BASE_URL }}
          # set only if you enabled Vercel Preview Protection
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Clerk keys needed for clerkSetup() in global-setup.ts
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm main exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/main/test-results
            apps/main/playwright-report
